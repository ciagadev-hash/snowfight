{ const c = document.createElement('canvas'); c.width = 16; c.height = 512; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);

// sea
{ const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 512, 512);

berg(-46, -70, 9, 7); berg(-30, -82, 6, 10); berg(38, -76, 11, 6); berg(60, -60, 5, 4); berg(8, -95, 7, 5); berg(-70, -50, 6, 3);

{ const top = new THREE.CircleGeometry(FR, 128), p = top.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, (fbm(x * .25, y * .25, 3) - .5) * .35); } top.computeVertexNormals();
  const c = document.createElement('canvas'); c.width = c.height = 1024; const x = c.getContext('2d'); x.fillStyle = '#f7fbff'; x.fillRect(0, 0, 1024, 1024);

// snowball players: lumpy packed snow, glossy eyes, knit beanie with a pom-pom
const eyeK = new THREE.MeshPhysicalMaterial({ color: 0x0b1626, roughness: .05, clearcoat: 1 }), shine = new THREE.MeshBasicMaterial({ color: 0xffffff }), blush = new THREE.MeshBasicMaterial({ color: 0xff8fa3, transparent: true, opacity: .6 });

function snowball(r, hat, pos, yaw = 0, tilt = 0, face = 'smile', tag = null) {
  const g = new THREE.Group(), geo = new THREE.IcosahedronGeometry(1, 40), p = geo.attributes.position, cols = [];

    const mo = new THREE.Mesh(new THREE.SphereGeometry(.2, 32, 24, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0x3a0d1c, roughness: .3, side: THREE.DoubleSide })); mo.scale.set(1.25, 1.1, .5); mo.position.set(0, -.08, .95); F.add(mo);
    const tg = new THREE.Mesh(new THREE.SphereGeometry(.11, 24, 16), new THREE.MeshPhysicalMaterial({ color: 0xff6f91, roughness: .35, clearcoat: .6 })); tg.scale.set(1.2, .6, .5); tg.position.set(0, -.24, .99); F.add(tg);
    for (const s of [-1, 1]) { const br = new THREE.Mesh(new THREE.CapsuleGeometry(.035, .2, 6, 12), eyeK); br.rotation.z = Math.PI / 2 + s * .4; br.position.set(s * .3, .31, .96); F.add(br);
      const st = new THREE.Mesh(new THREE.OctahedronGeometry(.07, 0), shine); st.scale.set(.5, 1.4, .3); st.position.set(s * .3 - .05, .2, 1.06); st.rotation.z = .3; F.add(st); const st2 = st.clone(); st2.rotation.z = .3 + Math.PI / 2; F.add(st2); }

  else { const m = new THREE.Mesh(new THREE.TorusGeometry(.11, .03, 12, 32, Math.PI), eyeK); m.rotation.z = Math.PI; m.position.set(0, -.1, .99); F.add(m); }

  for (let i = 0; i < 46; i++) { const a = i / 46 * Math.PI * 2 + rnd() * .2, rr = r * (.9 + rnd() * .35), h = .6 + rnd() * 1.6, d = new THREE.Mesh(new THREE.SphereGeometry(.12 + rnd() * .12, 12, 8), wm);

}
function streaks(x, y, z, n) { const c = document.createElement('canvas'); c.width = 16; c.height = 128; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(5, 0, 6, 128); const t = new THREE.CanvasTexture(c);
