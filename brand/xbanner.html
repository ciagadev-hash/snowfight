<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* SnowPump X banner (1500x500, render at 2x): a game-ad still from the real engine. The pfp covers the bottom-left, so type starts at x 430. */
@font-face{font-family:DynaPuff;font-weight:700;src:url(../site/fonts/dynapuff.ttf)}
@font-face{font-family:Nunito;font-weight:900;src:url(../site/fonts/nunito-900.ttf)}
@font-face{font-family:Nunito;font-weight:800;src:url(../site/fonts/nunito-800.ttf)}
:root{--ink:#152b6b;--inkS:#0e1f52;--w1:#fff;--w2:#dff1ff;--g1:#5df29b;--g2:#1fcf6e;--p1:#ff7ab8;--p2:#ff3f93;--b1:#5cc0ff;--b2:#2f8dff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1500px;height:500px;overflow:hidden;background:#2f8dff;font-family:Nunito,sans-serif;-webkit-font-smoothing:antialiased}
#cv{position:absolute;inset:0;width:1500px;height:500px}
#fx,#tags,#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gt{position:relative;display:inline-block;font-family:DynaPuff;font-weight:700;color:var(--ink);-webkit-text-stroke:.16em var(--ink);line-height:1.08;padding:0 .05em;white-space:nowrap;z-index:0}
.gt::before{content:attr(data-t);position:absolute;inset:0;padding:inherit;-webkit-text-stroke:0;color:transparent;background:linear-gradient(180deg,var(--w1),var(--w2));-webkit-background-clip:text;background-clip:text}
.gt::after{content:attr(data-t);position:absolute;inset:0;padding:inherit;z-index:-1;color:var(--inkS);-webkit-text-stroke:.16em var(--inkS);transform:translateY(.075em)}
.gt.g::before{background-image:linear-gradient(180deg,var(--g1),var(--g2))}.gt.p::before{background-image:linear-gradient(180deg,var(--p1),var(--p2))}.gt.b::before{background-image:linear-gradient(180deg,var(--b1),var(--b2))}
.ptag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;transform-origin:50% 100%}
.ptag b{font:700 20px/1 DynaPuff;color:#fff;background:var(--ink);border-radius:999px;padding:6px 12px 7px;box-shadow:0 3px 0 var(--inkS),0 6px 12px rgba(14,31,82,.3)}
.ptag span{font:900 15px/1.2 Nunito;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.ptag.rich b{background:linear-gradient(180deg,var(--g1),var(--g2));text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--inkS)}
.ptag.me b{background:linear-gradient(180deg,var(--g1),var(--g2));font-size:26px;padding:7px 15px 8px;box-shadow:0 0 0 3.5px var(--ink),0 6px 0 3.5px var(--inkS);text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}.ptag.me span{font-size:17px}
/* sunburst behind the title */
#burst{position:absolute;left:0;top:0;width:1500px;height:500px;opacity:.55;mix-blend-mode:screen}
#kick{position:absolute;left:452px;top:30px;display:inline-flex;align-items:center;gap:10px;padding:7px 16px 8px 10px;border-radius:999px;background:var(--ink);color:#fff;font:900 17px Nunito;letter-spacing:.06em;transform:rotate(-4deg);box-shadow:0 5px 0 var(--inkS),0 12px 22px rgba(14,31,82,.3)}
#kick i{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
#title{position:absolute;left:440px;top:52px;transform:rotate(-4deg);transform-origin:0 50%}#title .gt{font-size:142px}
#tl{position:absolute;left:470px;top:222px;transform:rotate(-2.5deg)}#tl .gt{font-size:46px}
#cta{position:absolute;left:470px;top:318px;display:flex;gap:16px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;height:70px;padding:0 34px;border-radius:24px;font:700 33px DynaPuff;color:#fff;background:linear-gradient(180deg,#4ff09a,#16c266);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.4),0 0 0 4.5px var(--ink),0 8px 0 4.5px var(--inkS),0 18px 28px rgba(14,31,82,.3);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 20px 0 16px;border-radius:20px;background:#fff;font:900 23px Nunito;color:var(--ink);box-shadow:0 0 0 4px var(--ink),0 7px 0 4px var(--inkS),0 14px 22px rgba(14,31,82,.25)}
.chip svg{width:26px;height:26px;flex:none}.chip .gt{font-size:28px}
.cap{position:absolute;left:0;top:0;transform-origin:50% 50%}
.pop{position:absolute;left:0;top:0}
</style></head><body><canvas id="cv"></canvas><canvas id="burst" width="1500" height="500"></canvas><div id="tags"></div><div id="ui">
<div id="kick"><i></i>PLAY-TO-EARN PVP · SOLANA</div>
<div id="title"><span class="gt" data-t="SnowPump">SnowPump</span></div>
<div id="tl"><span class="gt" data-t="Push. Grow.">Push. Grow.</span> <span class="gt g" data-t="Cash out!">Cash out!</span></div>
<div id="cta"><span class="btn">PLAY FREE</span>
<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#2f8dff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8c2.6 2.6 3.9 5.6 3.9 9.2s-1.3 6.6-3.9 9.2c-2.6-2.6-3.9-5.6-3.9-9.2s1.3-6.6 3.9-9.2z"/></svg>snowpumppvp.fun</span>
<span class="chip"><span class="gt b" data-t="$SNOWPVP">$SNOWPVP</span></span></div>
<div class="cap" id="bonk"><span class="gt p" data-t="BONK!" style="font-size:78px">BONK!</span></div>
<div class="pop" id="pop"><span class="gt g" data-t="+$5.40" style="font-size:40px">+$5.40</span></div>
</div>
<script type="module">
import { createWorld } from '../site/world.js';
import { SHOTS, filmMoney } from '../video/shots.js';
const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? +q.get(k) : d), $ = (id) => document.getElementById(id);
const W = createWorld($('cv'), { film: true, faceCam: .45, faceMax: 1.1, flakes: 700 }); W.setSize(1500, 500, Math.min(2, devicePixelRatio || 1)); const cam = W.cam;
// the shove: the film's bonk shot, the hero in pump.fun green
const sh = SHOTS.find((s) => s.id === 'bonk'); W.reset(); const S = sh.setup(); S.hero.col = '#' + (q.get('hat') || '3fc982'); S.hero.name = 'you';
const T = num('t', .55);
let prev = 0; for (let f = 0; f <= Math.round(T * 60); f++) { const st = sh.time(f / 60); S.run(st); for (const ev of S.ev) W.event(ev); S.ev.length = 0; W.update(S, S.alpha(st), st - prev); prev = st; }
const a = S.alpha(prev), ip = (e) => [e.px + (e.x - e.px) * a, e.pz + (e.z - e.pz) * a];
// camera on the shove, then a lens shift puts the action in the right third (sx, sy = where its centre lands on the banner)
{ const [hx, hz] = ip(S.hero), [vx, vz] = ip(S.victim), C = [(hx + vx) / 2 + num('dx', 0), num('ly', 2), (hz + vz) / 2];
  cam.position.set(C[0] + num('ox', -9), num('oy', 4.2), C[2] + num('oz', 15)); cam.lookAt(...C); cam.fov = num('fov', 40);
  const SX = num('sx', 1180), SY = num('sy', 300); cam.setViewOffset(2 * SX, 2 * SY, 0, 0, 1500, 500); cam.updateProjectionMatrix(); cam.updateMatrixWorld(); }
// keep the type area clean: drop crowd balls near the lens or in front of the title block, then redraw without them
const TXT = (x, y) => x > 400 && x < 1060 && y < 400;
for (const e of [...S.ents]) { if (e === S.hero || e === S.victim) continue; const [x, z] = ip(e), p = W.project(x, e.r, z), d = Math.hypot(cam.position.x - x, cam.position.y, cam.position.z - z);
  if (d < 12 || (TXT(p.x, p.y) && d < 40)) S.ents.splice(S.ents.indexOf(e), 1); }
W.update(S, a, 0);
// price tags (not the one going over the edge)
const D = W.discs(S, a);
for (const e of S.ents) { if (e.st !== 'live') continue; const [x, z] = ip(e), p = W.project(x, e.r * 2.2, z); if (!p.on || p.x < 20 || p.x > 1480 || TXT(p.x, p.y)) continue;
  const d = Math.hypot(cam.position.x - x, cam.position.y - e.r * .94, cam.position.z - z), cov = W.cover(p.x, p.y, d, e.id, D); if (cov > .5) continue;
  const el = document.createElement('div'); el.className = 'ptag' + (e === S.hero ? ' me' : e.r * e.r * 3.2 >= 8 ? ' rich' : ''); el.innerHTML = `<b>${e === S.hero ? '$48.20' : filmMoney(e.r)}</b><span>${e.name}</span>`;
  el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) translate(-50%,-100%) scale(${Math.min(1.15, Math.max(.6, 26 / d)).toFixed(3)})`; $('tags').appendChild(el); }
// BONK by the victim, the KO pop above the hero
{ const V = S.victim, [vx, vz] = ip(V), p = W.project(vx, V.r * 2.6 + 1.2, vz); $('bonk').style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%) rotate(8deg)`; }
{ const H = S.hero, [hx, hz] = ip(H), p = W.project(hx, H.r * 3.2, hz); $('pop').style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-100%) rotate(-6deg)`; }
// soft white sunburst behind the title
{ const c = $('burst').getContext('2d'), cx = 760, cy = 150; c.translate(cx, cy); for (let i = 0; i < 26; i++) { c.rotate(Math.PI * 2 / 26); const g = c.createLinearGradient(0, 0, 900, 0); g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; if (i % 2) { c.beginPath(); c.moveTo(0, 0); c.lineTo(900, -55); c.lineTo(900, 55); c.fill(); } } }
await document.fonts.load('700 80px DynaPuff'); await document.fonts.load('900 20px Nunito');
W.render(); document.body.dataset.ready = '1';
</script></body></html>
