<script type="module">
import { createWorld } from '../site/world.js';
import { SHOTS, FPS, DUR, BEAT, shotAtFrame, filmMoney, HERO } from './shots.js';

const q = new URLSearchParams(location.search), VERT = q.get('ar') === '916', WID = VERT ? 1080 : 1920, HEI = VERT ? 1920 : 1080;
document.documentElement.style.setProperty('--W', WID + 'px'); document.documentElement.style.setProperty('--H', HEI + 'px'); if (VERT) document.body.classList.add('v');

const gt = (el, s) => { if (el.dataset.t !== s) { el.textContent = s; el.dataset.t = s; } };

const sc = VERT ? .62 : 1;                             // caption scale for the vertical cut

// ---------------- shots ----------------
let cur = null, LOG = null;
const ip = (e, a) => [e.px + (e.x - e.px) * a, e.pz + (e.z - e.pz) * a];
function startShot(sh) {
  W.reset(); const S = sh.setup(); S.run(sh.time(0)); S.ev.length = 0; W.FR = S.FR;
  cur = { sh, S, f: sh.f0 - 1, sim: sh.time(0), look: null, pos: null, shake: 0, feed: [], pops: [], popAcc: 0, popF: 0, kos: [], beat: -1 };
}
function onEvent(ev, f) {
  const H = cur.S.hero, t = f / FPS, e = ev.e;
  if (ev.k === 'pile' && e === H) cur.popAcc += ev.v * 2;
  if (ev.k === 'fall') { const mine = ev.by === H || (cur.sh.id === 'strike' && cur.S.pins.includes(e)); const gain = e.r * e.r * 1.6 * 2 * .6; cur.feed.push({ f, by: mine ? HERO.name : ev.by ? ev.by.name : null, col: mine ? HERO.col : ev.by ? ev.by.col : null, name: e.name, vcol: e.col, gain, mine });

  if (LOG) { const d = e ? Math.hypot(cam.position.x - e.x, cam.position.y, cam.position.z - e.z) : ev.x != null ? Math.hypot(cam.position.x - ev.x, cam.position.y, cam.position.z - ev.z) : 30;
    if (ev.k === 'hit') LOG.push({ t, k: 'hit', s: ev.s, dash: ev.dash, d, hero: ev.a === H || ev.b === H });
    else if (ev.k === 'dash' || ev.k === 'fall' || ev.k === 'cashout' || ev.k === 'cashstart' || ev.k === 'land') LOG.push({ t, k: ev.k, d, hero: e === H, r: e.r });
    else if (ev.k === 'pile' && e === H) LOG.push({ t, k: 'pile', d }); }
}
W.onSplash = (e) => { if (LOG) LOG.push({ t: cur.f / FPS, k: 'splash', r: e.r, d: Math.hypot(cam.position.x - e.x, cam.position.y + 1.4, cam.position.z - e.z) }); };

// cameras: [pos, look, fov]; whips turn the camera hard at the cut
const WHIP_IN = new Set(['bonk', 'strike', 'bye', 'cash']), WHIP_OUT = new Set(['grow', 'bonk', 'strike', 'price']);
function shotCam(sh, u, a) {
  const S = cur.S, H = S.hero, dur = sh.t1 - sh.t0; let p, l, fov = 40;
  const hp = H ? ip(H, a) : [0, 0], hr = H ? H.r : 1;
  switch (sh.id) {
    case 'hook': { const V = S.victim, vp = ip(V, a), k = eio(lin(u, .25, 1.5)), k2 = eio(lin(u, 1.45, 2.45)), fallen = V.st === 'fall' ? cl((S.t - (1 - a) * STEP - V.st0) / .7) : 0;
      p = [lerp(lerp(12.5, 11.2, k), 7.5, k2), lerp(lerp(2.9, 3.3, k), 2.2, k2), lerp(lerp(-19.6, -23.2, k), -27.5, k2)]; l = [lerp((hp[0] + vp[0]) / 2, vp[0], k) - 1 + k2, lerp(2.3, 1.6, k) - fallen * 2.6, lerp((hp[1] + vp[1]) / 2, vp[1], k) - k2];
      fov = 40 - (u > .2 && u < .4 ? 5 * Math.sin(lin(u, .2, .4) * Math.PI) : 0); break; }
    case 'logo': { const k = eio(lin(u, 0, dur)), a2 = .2 + k * .55, R = lerp(24, 44, k); p = [Math.sin(a2) * R, lerp(3.2, 38, k), Math.cos(a2) * R]; l = [0, lerp(2.2, -4, k), 0]; fov = 44; break; }
    case 'grow': { const k = u / dur; p = [hp[0] + 2.2 + Math.sin(u * .9) * 1.2, 1.9 + hr * 1.15, hp[1] + 4.6 + hr * 2.1]; l = [hp[0] + .3, hr * .75, hp[1] - 1.2]; fov = 42 + k * 2; break; }
    case 'bonk': { const V = S.victim, vp = ip(V, a), k = eio(lin(u, .1, 1)); p = [20.6 + u * 1.4, 2.6, 16.2]; l = [lerp(21.8, vp[0] * .6 + 26 * .4, k), 1.9 - (V.st === 'fall' ? cl((S.t - (1 - a) * STEP - V.st0) / .7) * 1.6 : 0), 1.6]; fov = 38; break; }
    case 'strike': { const px = S.pins.reduce((m, e) => m + ip(e, a)[0], 0) / S.pins.length, k = eio(lin(u, .3, 1.1)); p = [lerp(-19.8, -23, k), 6.4 - u * .4, 15.2]; l = [lerp(-22.4, Math.max(-30, px), k), 1.4 - k * .6, 0]; fov = 42; break; }
    case 'bye': { const k = lin(u, 0, 1.7); p = [3.4, 2.5, -42.6 + u * .5]; l = [lerp(.4, 0, k), lerp(2.2, .1, lin(u, .9, 1.8)), lerp(-24.5, -30, eio(k))]; fov = 40; break; }
    case 'ice': { const a2 = .55 + u * .14; p = [Math.sin(a2) * 33, 34 - u * 1.6, Math.cos(a2) * 33]; l = [0, -1, 0]; fov = 46; break; }
    case 'price': p = [Math.sin(u * .3) * 1.2, 4 + u * .15, (VERT ? 25 : 19.5) + u * 1.4]; l = [0, 3.1, u * .9]; fov = 42; break;
    case 'cash': { const ca = (CASH_T - sh.t0), aft = Math.max(0, u - ca), k = eio(lin(u, 0, ca)), a2 = .95 + u * .08, d = lerp(21, 15.5, k) + aft * 3.2 + (VERT ? 6 : 0);
      p = [Math.sin(a2) * d, lerp(6.6, 4.7, k) + aft * 3.4, Math.cos(a2) * d]; l = [0, lerp(3.7, 3.1, k) + aft * .5, 0]; fov = 40; break; }
    case 'end': { p = [0, VERT ? 3.2 : 2.5, VERT ? 27 : 19]; l = [0, VERT ? 5.8 : 4.2, 0]; fov = 40; break; }
  }
  // the vertical cut is narrow: pull the camera back along its view for the close action shots
  const VD = VERT ? ({ hook: 1.6, grow: 1.3, bonk: 1.65, strike: 1.45, bye: 1.35 })[sh.id] || 1 : 1; if (VD !== 1) p = p.map((v, i) => l[i] + (v - l[i]) * VD);
  // smooth whatever tracks the action (film-time damping, so slow motion still glides)
  if (!cur.look) { cur.look = l.slice(); cur.pos = p.slice(); } else { const k = 1 - Math.exp(-9 / FPS); for (let i = 0; i < 3; i++) { cur.look[i] += (l[i] - cur.look[i]) * k; cur.pos[i] += (p[i] - cur.pos[i]) * Math.min(1, k * 1.6); } }

  cam.position.set(P[0], P[1], P[2]); cam.fov = VERT ? Math.min(75, 2 * Math.atan(Math.tan(fov * Math.PI / 360) * 1.25) * 180 / Math.PI) : fov; cam.updateProjectionMatrix();

function tick(f) {

  S.run(st); for (const ev of S.ev) { W.event(ev); onEvent(ev, f); } S.ev.length = 0;

// ---------------- overlay: captions ----------------
const CAPS = [
  { t0: .215, t1: 1.6, lines: [[['SHOVE!', 'p']]], y: .16, size: 210, rot: -7 },
  { t0: T.grow + .12, t1: T.grow + 1.8, lines: [[['SCOOP', ''], ['SNOW', '']]], y: VERT ? .7 : .8, size: 130, rot: -3 },
  { t0: T.grow + 1.875, t1: T.grow + 3.66, lines: [[['GROW', 'g'], ['BIG!', 'g']]], y: VERT ? .7 : .8, size: 160, rot: 3 },
  { t0: T.bonk + .23, t1: T.bonk + 1.36, lines: [[['BONK!', 'p']]], y: .15, size: 210, rot: 6 },
  { t0: T.strike + .205, t1: T.strike + 1.36, lines: [[['STRIKE!', 'b']]], y: .15, size: 210, rot: -5 },
  { t0: T.bye + .95, t1: T.bye + 1.84, lines: [[['BYE', 'p'], ['BYE!', 'p']]], y: .15, size: 200, rot: 4 },
