{ const c = document.createElement('canvas'); c.width = 16; c.height = 512; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#6fb7ff'); g.addColorStop(.45, '#b9dcff'); g.addColorStop(.62, '#ffe6d6'); g.addColorStop(1, '#ffd2bd'); x.fillStyle = g; x.fillRect(0, 0, 16, 512); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; sc.background = t; }

  const m = new THREE.Mesh(g, iceM), a = i / 10 * Math.PI * 2 + rnd(), d = 95 + rnd() * 40; m.scale.set(7 + rnd() * 9, 5 + rnd() * 7, 7 + rnd() * 7); m.position.set(Math.cos(a) * d, -1.4, Math.sin(a) * d); sc.add(m); }

const floeSide = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.04, 1.4, 128, 1, true), new THREE.MeshPhysicalMaterial({ color: 0x7fd0ff, roughness: .08, clearcoat: 1, emissive: 0x1d6fa8, emissiveIntensity: .25 })); floeSide.position.y = -.7;
const edge = new THREE.Mesh(new THREE.RingGeometry(.975, 1, 128), new THREE.MeshBasicMaterial({ color: 0x7fc4ff, transparent: true, opacity: .7 })); edge.rotation.x = -Math.PI / 2; edge.position.y = .03;
